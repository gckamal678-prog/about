<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कमल जी.सी. - आधिकारिक वेबसाइट</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --header-bg: #ffffff;
            --box-bg: #ffffff;
            --border-color: #3498db;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --header-bg: #1e1e1e;
            --box-bg: #1e1e1e;
            --border-color: #3498db;
            --sidebar-bg: #1a1a1a;
            --sidebar-text: #ffffff;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Top Bar / Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--header-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
            transition: background-color 0.3s;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
        }

        .logo-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-color);
        }

        .control-btn {
            background: none;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .control-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* Sidebar Menu */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            transition: left 0.3s ease;
            z-index: 1100;
            padding-top: 80px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--sidebar-text);
            font-size: 24px;
            cursor: pointer;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li {
            padding: 15px 25px;
            border-bottom: 1px solid #34495e;
            cursor: pointer;
        }

        .sidebar ul li:hover {
            background-color: #34495e;
        }

        /* Main Container */
        .main-container {
            max-width: 1200px;
            width: 100%;
            margin: 75px auto 40px auto;
            padding: 15px;
            flex: 1;
        }

        .content-section {
            display: none;
        }

        .content-section.active-section {
            display: block;
        }

        /* Live Widget Styling */
        .live-widget {
            background: var(--box-bg);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s;
        }

        /* Hero / Home Section */
        .hero-section {
            background: var(--box-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
            transition: background-color 0.3s;
        }

        .tagline {
            font-style: italic;
            color: #3498db;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .hero-image-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            background-color: #e2e8f0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h2 {
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .section-box {
            background: var(--box-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 30px;
            transition: background-color 0.3s;
        }

        /* Footer */

            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            text-align: center;
            padding: 20px;
            margin-top: auto;

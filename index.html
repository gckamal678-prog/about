<!DOCTYPE html>
<html lang="np">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMAL G.C. - Personal Website</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Navigation Bar */
    nav {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav .logo {
      font-size: 1.2rem;
      font-weight: bold;
      color: #38bdf8;
      text-decoration: none;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 15px;
    }

    nav ul li a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    nav ul li a:hover {
      color: #38bdf8;
    }

    /* Main Container */
    .main-container {
      width: 100%;
      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px;
      flex-grow: 1;
    }

    .hero-box {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .hero-box h1 {
      color: #38bdf8;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .hero-box p {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* Quick Nav Buttons */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .menu-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 12px;
      text-decoration: none;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .menu-card i {
      font-size: 24px;
      color: #38bdf8;
    }

    .menu-card span {
      font-size: 13.5px;
      font-weight: 600;
    }

    .menu-card:hover {
      border-color: #38bdf8;
      transform: translateY(-3px);
      background: rgba(15, 23, 42, 0.9);
    }

    /* Footer */
    footer {
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 20px;
      text-align: center;
      margin-top: 40px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    .footer-links a {
      color: #cbd5e1;
      font-size: 20px;
      transition: color 0.2s ease, transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .footer-links a:hover {
      color: #38bdf8;
      transform: scale(1.15);
    }

    .footer-text {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav>
    <a href="index.html" class="logo">KAMAL G.C.</a>
    <ul>
      <li><a href="about.html">About</a></li>
      <li><a href="tech.html">AI & Tech</a></li>
      <li><a href="emergency.html">Emergency</a></li>
    </ul>
  </nav>

  <!-- Main Content Box -->
  <main class="main-container">
    <div class="hero-box">
      <h1>स्वागतम्! (Welcome)</h1>
      <p>मेरो व्यक्तिगत वेबसाइटमा स्वागत छ। यहाँ मेरो परिचय, प्रविधि/AI सम्बन्धी जानकारी र नेपालका मुख्य आपत्कालीन सेवाहरूको लिङ्क प्राप्त गर्न सक्नुहुन्छ।</p>

      <!-- Main Navigation Buttons -->
      <div class="menu-grid">
        <a href="about.html" class="menu-card">
          <i class="fa-solid fa-user"></i>
          <span>मेरो बारेमा</span>
        </a>
        <a href="tech.html" class="menu-card">
          <i class="fa-solid fa-robot"></i>
          <span>AI र प्रविधि</span>
        </a>
        <a href="emergency.html" class="menu-card">
          <i class="fa-solid fa-phone-volume"></i>
          <span>आपत्कालीन नम्बर</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <!-- App Icon Link -->
      <a href="https://kids.kamalgc.com.np" target="_blank" title="Kids App">
        <i class="fa-solid fa-mobile-screen-button"></i>
      </a>
      <!-- Main Domain Link -->
      <a href="https://kamalgc.com.np" target="_blank" title="Website Home">
        <i class="fa-solid fa-globe"></i>
      </a>
    </div>
    <p class="footer-text">&copy; KAMAL G.C. All Rights Reserved.</p>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>मेरो साथी</title>
<meta name="description" content="मेरो साथी - सबैको साझा डिजिटल चौतारी।">
<meta name="theme-color" content="#080d19">
<link rel="canonical" href="https://kamalgc.com.np/">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="mylogo.png">
<link rel="apple-touch-icon" href="mylogo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#080d19;--surface:#101a2b;--surface2:#17253b;
 --text:#f4f7ff;--muted:#a5b2c7;--line:rgba(163,190,230,.14);
 --accent:#72d5ff;--accent2:#a78bfa;--shadow:0 15px 45px rgba(0,0,0,.22)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
 font-family:"DM Sans","Noto Sans Devanagari",sans-serif;
 background:radial-gradient(ellipse at 12% 8%,rgba(46,125,205,.15),transparent 34%),var(--bg);
 color:var(--text);min-height:100vh;line-height:1.65;padding-bottom:100px;overflow-x:hidden
}
button,input,textarea{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.container{width:min(750px,calc(100% - 24px));margin:auto}
.site-header{position:sticky;top:0;z-index:100;background:rgba(8,13,25,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.header-inner{min-height:65px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-logo{width:39px;height:39px;object-fit:cover;border-radius:50%;border:1px solid var(--line)}
.brand-name{font-size:16px;font-weight:800;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:8px}
.profile-link{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);display:block;flex-shrink:0;background:var(--surface2)}
.profile-link img{width:100%;height:100%;object-fit:cover;display:block}
.header-profile-initials{width:100%;height:100%;display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--accent)}
.live-info{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:7px 12px;margin-top:11px;padding:9px 12px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}
.live-info-item{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px;font-weight:600}
.live-info-item strong{color:var(--text)}
.live-dot{width:6px;height:6px;border-radius:50%;background:#39d98a;box-shadow:0 0 8px #39d98a}
.stories-container{display:flex;gap:10px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.stories-container::-webkit-scrollbar{display:none}
.story-card{flex:0 0 74px;height:115px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;overflow:hidden}
.story-card.add-story{border:2px dashed var(--accent)}
.story-card span{font-size:10px;font-weight:700;text-align:center;width:100%;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:15px 0;box-shadow:var(--shadow)}
.composer-top-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.composer-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--accent);flex-shrink:0}
.composer-inputs{flex:1;display:flex;flex-direction:column;gap:8px}
.composer textarea,.composer input[type="text"]{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:11px;outline:none;font-size:13px}
.composer textarea{resize:vertical;min-height:75px}
.composer-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.emoji-picker-wrap{position:relative}
.emoji-dropdown{display:none;position:absolute;bottom:45px;left:0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:18px;z-index:10;width:220px;flex-wrap:wrap;gap:6px;box-shadow:var(--shadow)}
.emoji-dropdown span{cursor:pointer;padding:4px;border-radius:6px}
.emoji-dropdown span:hover{background:var(--surface)}
.primary-button{border:0;border-radius:12px;padding:9px 18px;font-size:12px;font-weight:800;background:linear-gradient(110deg,#75ddff,#b5a2ff);color:#071322}
.secondary-button{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--text);display:inline-flex;align-items:center;gap:5px}
.feed-heading{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.feed-heading h2{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.post-grid{display:flex;flex-direction:column;gap:16px}
.post-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow);position:relative}
.post-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.post-author-wrap{display:flex;align-items:center;gap:10px}
.post-user-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--surface2)}
.post-author-info strong{display:block;font-size:14px}
.post-author-info small{color:var(--muted);font-size:10px}
.post-options{position:relative}
.options-btn{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px}
.options-dropdown{display:none;position:absolute;right:0;top:30px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:10;width:125px}
.options-dropdown button{width:100%;text-align:left;background:none;border:0;color:var(--text);padding:8px 12px;font-size:11px;font-weight:700}
.options-dropdown button:hover{background:var(--surface)}
.post-title{font-size:17px;font-weight:800;margin-bottom:8px;overflow-wrap:anywhere}
.post-content{font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px}
.post-image{width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-bottom:12px;background:var(--surface2)}
.reaction-popup-container{position:relative;display:inline-block}
.reaction-bar{display:none;position:absolute;bottom:42px;left:0;background:var(--surface2);border:1px solid var(--line);border-radius:30px;padding:6px 10px;gap:6px;box-shadow:var(--shadow);z-index:20;align-items:center}
.reaction-bar.show{display:flex}
.reaction-btn{border:0;background:none;font-size:18px;padding:2px}
.reaction-details{margin-bottom:10px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.post-actions-bar{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:10px;flex-wrap:wrap;gap:8px}
.post-action-btn{background:transparent;border:0;color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px}
.post-action-btn:hover{background:var(--surface2)}
.post-action-btn.active{color:var(--accent)}
.comment-area{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.comment{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.comment-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.comment-body{overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.6;margin-left:36px}
.comment-tools{margin:4px 0 0 36px}
.text-action{border:0;background:none;color:var(--accent);font-size:11px;padding:2px}
.reply-list{margin:8px 0 0 32px;padding-left:10px;border-left:2px solid var(--line)}
.comment-form,.reply-form{display:flex;gap:7px;margin-top:10px}
.comment-form input,.reply-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:8px 12px;font-size:12px;outline:none}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;justify-content:center;align-items:center;padding:15px;backdrop-filter:blur(5px)}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:450px;padding:20px;box-shadow:var(--shadow)}
.site-toast{position:fixed;left:50%;bottom:100px;z-index:2000;transform:translate(-50%,15px);opacity:0;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 15px;font-size:11px;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
.site-toast.show{opacity:1;transform:translate(-50%,0)}
.footer{text-align:center;padding:25px 0;color:var(--muted);font-size:10px}
@media(min-width:850px){body{padding-bottom:24px}.container{width:min(750px,calc(100% - 32px))}}
</style>
</head>

<body>
<header class="site-header">
 <div class="container header-inner">
  <div class="brand">
   <img class="brand-logo" src="mylogo.png" alt="मेरो साथी लोगो">
   <span class="brand-name">मेरो साथी</span>
  </div>
  <div class="header-right">
   <a href="settings.html" class="profile-link" aria-label="प्रोफाइल र सेटिङ">
    <img id="header-user-photo" src="mylogo.png" alt="Profile">
    <span id="header-user-initials" class="header-profile-initials" hidden>म</span>
   </a>
  </div>
 </div>
</header>

<main class="container">
 <section class="live-info" aria-label="Live info">
  <div class="live-info-item"><span class="live-dot"></span><strong id="real-time">समय लोड हुँदै...</strong></div>
  <div class="live-info-item"><span>🌡️</span><strong id="weather-temp">--°C</strong></div>
  <div class="live-info-item"><span>📍</span><strong id="user-location">स्थान</strong></div>
 </section>

 <section class="stories-container" id="stories-bar">
  <div class="story-card add-story" onclick="openStoryModal()">
   <span style="font-size:22px;color:var(--accent)">＋</span><span>तपाईंको Story</span>
  </div>
 </section>

 <section class="composer" id="post-composer-box">
  <form id="inline-post-form">
   <div class="composer-top-row">
    <div class="composer-avatar" id="composer-user-avatar">म</div>
    <div class="composer-inputs">
     <textarea id="composer-content" placeholder="आज मनमा के कुरा खेलिरहेछ? यहाँ लेख्नुहोस्..." maxlength="5000" required></textarea>
     <input type="text" id="composer-title" placeholder="पोष्टको शीर्षक (वैकल्पिक)" maxlength="180">
    </div>
   </div>
   <div class="composer-bottom">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <label class="secondary-button">📷 फोटो जोड्नुहोस् <input type="file" id="composer-image" accept="image/*" hidden></label>
     <div class="emoji-picker-wrap">
      <button type="button" class="secondary-button" id="emoji-toggle">😀 इमोजी</button>
      <div class="emoji-dropdown" id="emoji-box">
       <span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('❤️')">❤️</span>
       <span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('👍')">👍</span>
       <span onclick="addEmoji('👏')">👏</span><span onclick="addEmoji('🙏')">🙏</span>
       <span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('✨')">✨</span>
      </div>
     </div>
    </div>
    <button type="submit" class="primary-button" id="publish-btn">पोष्ट गर्नुहोस्</button>
   </div>
  </form>
 </section>

 <section class="feed-section">
  <div class="feed-heading">
   <h2>नवीनतम पोष्टहरू</h2>
   <span id="post-count" style="font-size:11px;color:var(--muted)">लोड हुँदैछ...</span>
  </div>
  <div id="post-grid" class="post-grid">
   <div style="text-align:center;padding:30px;color:var(--muted)">पोष्टहरू लोड हुँदैछन्...</div>
  </div>
 </section>
</main>

<div class="modal-overlay" id="story-modal">
 <div class="modal-box">
  <h3 style="margin-bottom:10px;font-size:15px">नयाँ स्टोरी थप्नुहोस्</h3>
  <form id="story-form" onsubmit="uploadStory(event)">
   <input type="text" id="story-caption" placeholder="स्टोरीको क्याप्सन..." maxlength="100" style="width:100%;padding:10px;margin-bottom:10px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px" required>
   <input type="file" id="story-file" accept="image/*" style="margin-bottom:12px;width:100%;font-size:11px" required>
   <div style="display:flex;justify-content:flex-end;gap:8px">
    <button type="button" class="secondary-button" onclick="closeStoryModal()">रद्द गर्नुहोस्</button>
    <button type="submit" class="primary-button" id="story-btn">स्टोरी सेयर गर्नुहोस्</button>
   </div>
  </form>
 </div>
</div>

<footer class="footer">© <span id="current-year"></span> मेरो साथी · सर्वाधिकार सुरक्षित।</footer>
<div id="site-toast" class="site-toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const SUPABASE_URL="https://zbyntmyybhdcwmttkuys.supabase.co";
const SUPABASE_KEY="sb_publishable_N8U3og_Ntm-ImrtM8c1NGA_-Rqb3dSy";
const BUCKET="blog-images";
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let currentUser=null;
const profilesCache={};
let cachedPosts=[];
let pressTimer=null;

const REACTIONS=[
 {value:"👌",label:"सहमति"},
 {value:"🤔",label:"सोच"},
 {value:"💙",label:"माया"},
 {value:"😟",label:"सहानुभूति"},
 {value:"🤝",label:"समर्थन"}
];

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,char=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[char]));
}
function safeURL(value){
 try{
  const url=new URL(value,location.origin);
  return ["http:","https:"].includes(url.protocol)?url.href:"";
 }catch{return "";}
}
function showToast(message){
 const toast=$("site-toast");
 toast.textContent=message;
 toast.classList.add("show");
 window.setTimeout(()=>toast.classList.remove("show"),2800);
}
function profileName(profile){return profile?.display_name||"मेरो साथी सदस्य";}
function avatarHTML(profile,size=40){
 const name=profileName(profile);
 const avatar=safeURL(profile?.avatar_url);
 return `<div class="post-user-avatar" style="width:${size}px;height:${size}px;display:grid;place-items:center;font-weight:800;color:var(--accent);overflow:hidden">
 ${avatar?`<img src="${escapeHTML(avatar)}" alt="" style="width:100%;height:100%;object-fit:cover">`:escapeHTML(name.charAt(0)||"म")}
 </div>`;
}
async function loadProfiles(ids){
 if(!db)return;
 const missing=[...new Set(ids)].filter(id=>id&&!profilesCache[id]);
 if(!missing.length)return;
 const {data,error}=await db.from("profiles").select("id,display_name,avatar_url").in("id",missing);
 if(error){console.warn("Profiles load:",error.message);return;}
 (data||[]).forEach(profile=>profilesCache[profile.id]=profile);
}
function requireLogin(message="यो सुविधा प्रयोग गर्न पहिले Login गर्नुहोस्।"){
 if(currentUser)return true;
 showToast(message);
 window.setTimeout(()=>location.href="login.html",700);
 return false;
}

$("emoji-toggle").addEventListener("click",()=>{
 const box=$("emoji-box");
 box.style.display=box.style.display==="flex"?"none":"flex";
});
window.addEmoji=emoji=>{
 const input=$("composer-content");
 input.value+=emoji;
 input.focus();
 $("emoji-box").style.display="none";
};

setInterval(()=>{$("real-time").textContent=new Date().toLocaleTimeString("ne-NP");},1000);
$("weather-temp").textContent="२४°C";
$("user-location").textContent="नेपाल";

async function boot(){
 if(!db){
  $("post-grid").textContent="Supabase जडान हुन सकेन।";
  return;
 }
 try{
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  currentUser=data.session?.user||null;

  if(currentUser){
   const {data:profile}=await db.from("profiles")
    .select("id,display_name,avatar_url").eq("id",currentUser.id).maybeSingle();
   if(profile){
    profilesCache[currentUser.id]=profile;
    const avatar=safeURL(profile.avatar_url);
    if(avatar){
     $("header-user-photo").src=avatar;
     $("composer-user-avatar").innerHTML=`<img src="${escapeHTML(avatar)}" alt="" style="width:100%;height:100%;object-fit:cover">`;
    }else{
     const initial=(profile.display_name||"म").charAt(0);
     $("header-user-initials").textContent=initial;
     $("header-user-initials").hidden=false;
     $("header-user-photo").hidden=true;
     $("composer-user-avatar").textContent=initial;
    }
   }
  }
  await Promise.all([loadFeed(),loadStories()]);
  initRealtime();
 }catch(error){
  console.error(error);
  showToast("पेज लोड गर्दा समस्या भयो।");
 }
}
function initRealtime(){
 db.channel("index-page-updates")
  .on("postgres_changes",{event:"*",schema:"public",table:"blog_posts"},()=>loadFeed())
  .on("postgres_changes",{event:"*",schema:"public",table:"post_comments"},()=>loadFeed())
  .subscribe();
}

window.openStoryModal=()=>{
 if(!requireLogin("स्टोरी हाल्न पहिले Login गर्नुहोस्!"))return;
 $("story-modal").style.display="flex";
};
window.closeStoryModal=()=>{$("story-modal").style.display="none";};

window.uploadStory=async event=>{
 event.preventDefault();
 if(!requireLogin())return;
 const caption=$("story-caption").value.trim();
 const file=$("story-file").files[0];
 if(!file)return;
 const button=$("story-btn");
 button.disabled=true;
 button.textContent="अपलोड हुँदैछ...";
 try{
  if(file.size>2*1024*1024)throw new Error("फोटोको साइज २MB भन्दा सानो हुनुपर्छ।");
  const path=`stories/${currentUser.id}/${Date.now()}-${file.name.replace(/[^\w.-]/g,"_")}`;
  const {error:uploadError}=await db.storage.from(BUCKET).upload(path,file);
  if(uploadError)throw uploadError;
  const imageUrl=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  const {error}=await db.from("stories").insert({user_id:currentUser.id,image_url:imageUrl,caption});
  if(error)throw error;
  $("story-form").reset();
  closeStoryModal();
  showToast("स्टोरी सफलतापूर्वक सेयर भयो!");
  await loadStories();
 }catch(error){showToast("त्रुटि: "+error.message);}
 finally{button.disabled=false;button.textContent="स्टोरी सेयर गर्नुहोस्";}
};

async function loadStories(){
 const container=$("stories-bar");
 const addCard=`<div class="story-card add-story" onclick="openStoryModal()"><span style="font-size:22px;color:var(--accent)">＋</span><span>तपाईंको Story</span></div>`;
 const {data,error}=await db.from("stories")
  .select("id,image_url,caption,user_id,created_at")
  .order("created_at",{ascending:false}).limit(20);
 if(error){
  console.warn("Stories load:",error.message);
  container.innerHTML=addCard;
  return;
 }
 if(!data?.length){container.innerHTML=addCard;return;}
 await loadProfiles(data.map(story=>story.user_id));
 container.innerHTML=addCard+data.map(story=>{
  const image=safeURL(story.image_url);
  const caption=escapeHTML(story.caption);
  const name=escapeHTML(profileName(profilesCache[story.user_id]));
  return `<div class="story-card" title="${caption}">
   ${image?`<img src="${escapeHTML(image)}" alt="Story" loading="lazy" style="width:100%;height:100%;object-fit:cover;position:absolute">`:""}
   <div style="position:absolute;bottom:0;background:rgba(0,0,0,.65);width:100%;padding:3px"><span>${name}</span></div>
  </div>`;
 }).join("");
}

$("inline-post-form").addEventListener("submit",async event=>{
 event.preventDefault();
 if(!requireLogin("पोष्ट गर्न पहिले Login गर्नुहोस्!"))return;
 const content=$("composer-content").value.trim();
 if(!content)return;
 const title=$("composer-title").value.trim()||content.slice(0,30)+(content.length>30?"...":"");
 const file=$("composer-image").files[0];
 const button=$("publish-btn");
 button.disabled=true;button.textContent="पोष्ट हुँदैछ...";
 try{
  let imageUrl=null;
  if(file){
   if(file.size>2*1024*1024)throw new Error("फोटोको साइज २MB भन्दा सानो हुनुपर्छ।");
   const path=`${currentUser.id}/${Date.now()}-${file.name.replace(/[^\w.-]/g,"_")}`;
   const {error:uploadError}=await db.storage.from(BUCKET).upload(path,file);
   if(uploadError)throw uploadError;
   imageUrl=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }
  const authorName=profilesCache[currentUser.id]?.display_name||currentUser.email?.split("@")[0]||"सदस्य";
  const {error}=await db.from("blog_posts").insert({
   title,content,image_url:imageUrl,author_id:currentUser.id,author_name:authorName
  });
  if(error)throw error;
  $("inline-post-form").reset();
  showToast("पोष्ट सफलतापूर्वक सेयर भयो!");
  await loadFeed();
 }catch(error){showToast("त्रुटि: "+error.message);}
 finally{button.disabled=false;button.textContent="पोष्ट गर्नुहोस्";}
});

async function loadFeed(){
 const grid=$("post-grid");
 const {data:posts,error}=await db.from("blog_posts")
  .select("id,title,content,image_url,created_at,author_id,author_name")
  .order("created_at",{ascending:false}).limit(50);
 if(error){
  console.error(error);
  grid.textContent="फिड लोड गर्न असफल। Supabase table वा policy जाँच गर्नुहोस्।";
  return;
 }
 cachedPosts=posts||[];
 $("post-count").textContent=`${cachedPosts.length} पोष्टहरू`;
 if(!cachedPosts.length){
  grid.innerHTML='<div style="text-align:center;padding:30px;color:var(--muted)">अहिलेसम्म कुनै पोष्ट छैन। पहिलो पोष्ट तपाईं लेख्नुहोस्!</div>';
  return;
 }
 const ids=cachedPosts.map(post=>post.id);
 await loadProfiles(cachedPosts.map(post=>post.author_id));

 const [likesResult,commentsResult,reactionsResult]=await Promise.all([
  db.from("post_likes").select("post_id,user_id").in("post_id",ids),
  db.from("post_comments").select("id,post_id,user_id,content,created_at,parent_comment_id").in("post_id",ids).order("created_at",{ascending:true}),
  db.from("post_reactions").select("post_id,user_id,reaction").in("post_id",ids)
 ]);
 const likes=likesResult.data||[];
 const comments=commentsResult.data||[];
 const reactions=reactionsResult.data||[];
 await loadProfiles([...comments.map(c=>c.user_id),...reactions.map(r=>r.user_id)]);

 grid.innerHTML=cachedPosts.map(post=>{
  const profile=profilesCache[post.author_id];
  const author=escapeHTML(profile?.display_name||post.author_name||"मेरो साथी सदस्य");
  const postLikes=likes.filter(like=>like.post_id===post.id);
  const liked=!!currentUser&&postLikes.some(like=>like.user_id===currentUser.id);
  const postComments=comments.filter(comment=>comment.post_id===post.id);
  const roots=postComments.filter(comment=>!comment.parent_comment_id);
  const postReactions=reactions.filter(reaction=>reaction.post_id===post.id);
  const myReaction=currentUser?postReactions.find(r=>r.user_id===currentUser.id):null;
  const reactionNames=REACTIONS.map(reaction=>{
   const people=postReactions.filter(item=>item.reaction===reaction.value);
   return people.length?`${reaction.value} ${people.map(item=>escapeHTML(profileName(profilesCache[item.user_id]))).join(", ")}`:"";
  }).filter(Boolean).join(" · ");
  const isOwner=!!currentUser&&currentUser.id===post.author_id;
  const postId=escapeHTML(post.id);
  const title=escapeHTML(post.title);
  const content=escapeHTML(post.content);
  const image=safeURL(post.image_url);

  return `<article class="post-card" data-post="${postId}">
   <div class="post-header">
    <div class="post-author-wrap">
     ${avatarHTML(profile)}
     <div class="post-author-info"><strong>${author}</strong><small>${escapeHTML(new Date(post.created_at).toLocaleString("ne-NP"))}</small></div>
    </div>
    ${isOwner?`<div class="post-options">
     <button class="options-btn" onclick="toggleOptions('${postId}')" aria-label="पोष्ट विकल्प">⋮</button>
     <div class="options-dropdown" id="opt-${postId}">
      <button onclick="editPost('${postId}')">✏️ सम्पादन</button>
      <button onclick="deletePost('${postId}')" style="color:#ff6b6b">🗑️ मेटाउनुहोस्</button>
     </div>
    </div>`:""}
   </div>
   <div class="post-title">${title}</div>
   <div class="post-content">${content}</div>
   ${image?`<img src="${escapeHTML(image)}" class="post-image" alt="पोष्टको फोटो" loading="lazy">`:""}
   <div class="reaction-details">${reactionNames}</div>
   <div class="post-actions-bar">
    <div class="reaction-popup-container" onmouseleave="hideReactionPopup('${postId}')">
     <button class="post-action-btn ${liked?"active":""}" onclick="toggleLike('${postId}')" onmouseenter="showReactionPopup('${postId}')" ontouchstart="handleTouchStart(event,'${postId}')">
      ${myReaction?escapeHTML(myReaction.reaction):(liked?"♥ मन पर्यो":"♡ Like")} (${postLikes.length})
     </button>
     <div class="reaction-bar" id="react-bar-${postId}">
      ${REACTIONS.map(reaction=>`<button class="reaction-btn" onclick="handleReaction('${postId}','${reaction.value}')" aria-label="${escapeHTML(reaction.label)}">${reaction.value}</button>`).join("")}
     </div>
    </div>
    <button class="post-action-btn" onclick="toggleComments('${postId}')">💬 Comment (${postComments.length})</button>
    <button class="post-action-btn" onclick="sharePost('${postId}')">🔗 सेयर</button>
    <button class="post-action-btn" onclick="bookmarkPost('${postId}')">🔖 सेभ</button>
   </div>
   <section class="comment-area hidden" id="comments-${postId}">
    <div>${roots.map(comment=>renderComment(comment,postComments)).join("")}</div>
    <form class="comment-form" onsubmit="submitComment(event,'${postId}')">
     <input name="comment" maxlength="3000" required placeholder="आफ्नो Comment लेख्नुहोस्...">
     <button class="primary-button" style="padding:6px 12px">पठाउनुहोस्</button>
    </form>
   </section>
  </article>`;
 }).join("");
}

window.showReactionPopup=id=>$("react-bar-"+id)?.classList.add("show");
window.hideReactionPopup=id=>$("react-bar-"+id)?.classList.remove("show");
window.handleTouchStart=(event,id)=>{
 if(pressTimer)clearTimeout(pressTimer);
 pressTimer=setTimeout(()=>showReactionPopup(id),500);
};
window.addEventListener("touchend",()=>{if(pressTimer)clearTimeout(pressTimer);});
window.addEventListener("touchmove",()=>{if(pressTimer)clearTimeout(pressTimer);});

function renderComment(comment,allComments){
 const profile=profilesCache[comment.user_id];
 const replies=allComments.filter(item=>String(item.parent_comment_id)===String(comment.id));
 const commentId=escapeHTML(comment.id);
 const postId=escapeHTML(comment.post_id);
 return `<div class="comment">
  <div class="comment-head">${avatarHTML(profile,26)}<strong>${escapeHTML(profileName(profile))}</strong><span style="color:var(--muted);font-size:10px">${escapeHTML(new Date(comment.created_at).toLocaleTimeString("ne-NP"))}</span></div>
  <div class="comment-body">${escapeHTML(comment.content)}</div>
  <div class="comment-tools"><button class="text-action" onclick="toggleReplyForm('${commentId}')">↳ Reply</button></div>
  <form class="reply-form hidden" id="reply-form-${commentId}" onsubmit="submitReply(event,'${postId}','${commentId}')">
   <input name="reply" maxlength="3000" required placeholder="जवाफ लेख्नुहोस्...">
   <button class="secondary-button">पठाउनुहोस्</button>
  </form>
  ${replies.length?`<div class="reply-list">${replies.map(reply=>`<div class="comment">
   <div class="comment-head">${avatarHTML(profilesCache[reply.user_id],22)}<strong>${escapeHTML(profileName(profilesCache[reply.user_id]))}</strong></div>
   <div class="comment-body">${escapeHTML(reply.content)}</div>
  </div>`).join("")}</div>`:""}
 </div>`;
}

window.toggleOptions=id=>{
 const element=$("opt-"+id);
 if(element)element.style.display=element.style.display==="block"?"none":"block";
};
window.deletePost=async id=>{
 if(!requireLogin())return;
 if(!confirm("के तपाईं यो पोष्ट मेटाउन चाहनुहुन्छ?"))return;
 const {error}=await db.from("blog_posts").delete().eq("id",id).eq("author_id",currentUser.id);
 if(error)showToast("त्रुटि: "+error.message);
 else{showToast("पोष्ट मेटाइयो!");await loadFeed();}
};
window.editPost=async id=>{
 if(!requireLogin())return;
 const post=cachedPosts.find(item=>String(item.id)===String(id));
 if(!post)return;
 const newContent=prompt("पोष्ट सच्याउनुहोस्:",post.content);
 if(newContent===null)return;
 if(!newContent.trim()){showToast("पोष्ट खाली हुन सक्दैन।");return;}
 const {error}=await db.from("blog_posts").update({content:newContent.trim()}).eq("id",id).eq("author_id",currentUser.id);
 if(error)showToast("त्रुटि: "+error.message);
 else{showToast("पोष्ट अपडेट भयो!");await loadFeed();}
};
window.toggleLike=async postId=>{
 if(!requireLogin("Like गर्न पहिले Login गर्नुहोस्।"))return;
 const {data,error}=await db.from("post_likes").select("id").eq("post_id",postId).eq("user_id",currentUser.id).maybeSingle();
 if(error){showToast("Like गर्न समस्या भयो।");return;}
 const result=data
  ?await db.from("post_likes").delete().eq("post_id",postId).eq("user_id",currentUser.id)
  :await db.from("post_likes").insert({post_id:postId,user_id:currentUser.id});
 if(result.error)showToast("त्रुटि: "+result.error.message);
 await loadFeed();
};
window.handleReaction=async(postId,reaction)=>{
 if(!requireLogin("प्रतिक्रिया दिन पहिले Login गर्नुहोस्।"))return;
 hideReactionPopup(postId);
 const {data,error}=await db.from("post_reactions").select("id,reaction").eq("post_id",postId).eq("user_id",currentUser.id).maybeSingle();
 if(error){showToast("प्रतिक्रिया दिन समस्या भयो।");return;}
 let result;
 if(data){
  result=data.reaction===reaction
   ?await db.from("post_reactions").delete().eq("post_id",postId).eq("user_id",currentUser.id)
   :await db.from("post_reactions").update({reaction}).eq("post_id",postId).eq("user_id",currentUser.id);
 }else result=await db.from("post_reactions").insert({post_id:postId,user_id:currentUser.id,reaction});
 if(result.error)showToast("त्रुटि: "+result.error.message);
 await loadFeed();
};
window.toggleComments=id=>$("comments-"+id)?.classList.toggle("hidden");
window.toggleReplyForm=id=>$("reply-form-"+id)?.classList.toggle("hidden");
window.submitComment=async(event,postId)=>{
 event.preventDefault();
 if(!requireLogin("Comment गर्न पहिले Login गर्नुहोस्।"))return;
 const input=event.target.elements.comment;
 const content=input.value.trim();
 if(!content)return;
 const {error}=await db.from("post_comments").insert({post_id:postId,user_id:currentUser.id,content});
 if(error){showToast("त्रुटि: "+error.message);return;}
 input.value="";
 await loadFeed();
};
window.submitReply=async(event,postId,parentId)=>{
 event.preventDefault();
 if(!requireLogin("Reply दिन पहिले Login गर्नुहोस्।"))return;
 const input=event.target.elements.reply;
 const content=input.value.trim();
 if(!content)return;
 const {error}=await db.from("post_comments").insert({post_id:postId,user_id:currentUser.id,content,parent_comment_id:parentId});
 if(error){showToast("त्रुटि: "+error.message);return;}
 input.value="";
 await loadFeed();
};
window.sharePost=async id=>{
 const url=new URL("index.html",location.href);
 url.searchParams.set("post",id);
 try{
  await navigator.clipboard.writeText(url.href);
  showToast("पोष्टको लिंक कपी भयो!");
 }catch{
  prompt("यो लिंक कपी गर्नुहोस्:",url.href);
 }
};
window.bookmarkPost=id=>{
 let bookmarks=[];
 try{bookmarks=JSON.parse(localStorage.getItem("saved_bookmarks")||"[]");}catch{}
 if(!Array.isArray(bookmarks))bookmarks=[];
 if(!bookmarks.includes(id)){
  bookmarks.push(id);
  localStorage.setItem("saved_bookmarks",JSON.stringify(bookmarks));
  showToast("बुकमार्कमा सेभ भयो!");
 }else showToast("यो पोष्ट पहिले नै सेभ छ।");
};

$("current-year").textContent=new Date().getFullYear();
boot();
</script>

<!DOCTYPE html>
<html lang="np">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamal G.C. Portal</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Nepali Date Picker/Converter Library (NepaliFunctions) -->
  <script src="https://nepali-date-picker.bighnaraj.com.np/nepali.functions.v3.7.min.js"></script>
</head>
<body class="dark-mode">

  <!-- Fixed Top Main Header -->
  <header class="top-header">
    
    <!-- New Top Row: Brand, Search, Profile -->
    <div class="brand-row">
      <span class="brand-name">KAMAL G.C.</span>
      <div class="brand-icons">
        <i class="fa-solid fa-search"></i>
        <i class="fa-solid fa-user-circle"></i>
      </div>
    </div>

    <!-- Row 2: 5 Main Navigation Buttons -->
    <nav class="nav-row">
      <button class="btn-3d" onclick="location.href='#blog'" data-np="ब्लग" data-en="Blog">ब्लग</button>
      <button class="btn-3d" onclick="location.href='#emergency'" data-np="आपतकालीन" data-en="Emergency">आपतकालीन</button>
      <button class="btn-3d" onclick="location.href='#tech'" data-np="प्रबिधी" data-en="Technology">प्रबिधी</button>
      <button class="btn-3d" onclick="location.href='#about'" data-np="मेरो बारेमा" data-en="About Me">मेरो बारेमा</button>
      <button class="btn-3d lang-btn" id="lang-toggle" onclick="toggleLanguage()">EN</button>
    </nav>

    <!-- Row 3: Dynamic Live Info Bar -->
    <div class="info-row">
      <div class="info-item"><i class="fa-solid fa-location-dot"></i> <span id="user-location">Locating...</span></div>
      <div class="info-item"><i class="fa-regular fa-clock"></i> <span id="real-time">--:--:--</span></div>
      <div class="info-item"><i class="fa-regular fa-calendar-alt"></i> <span id="nepali-date">----/--/--</span></div>
      <div class="info-item"><i class="fa-solid fa-cloud-sun"></i> <span id="weather-temp">--°C</span></div>
      <div class="info-item theme-toggle" onclick="toggleTheme()">
        <i class="fa-solid fa-moon" id="theme-icon"></i> <span id="theme-text">Dark</span>
      </div>
    </div>
  </header>

  <!-- Middle Scrollable Blank Area (पछि सामग्री राख्नको लागि खाली छ) -->
  <main class="middle-content">
    <div class="placeholder-text" data-np="यहाँ पछि तपाईंको फोटो र लेखहरू रहनेछन्..." data-en="Your photos and articles will appear here later...">
      यहाँ पछि तपाईंको फोटो र लेखहरू रहनेछन्...
    </div>
  </main>

  <!-- Locked Bottom Footer -->
  <footer class="bottom-footer">
    <div class="footer-contact">
      <a href="mailto:kids.kamalgc.com.np"><i class="fa-solid fa-envelope"></i> kids.kamalgc.com.np</a>
      <a href="mailto:Support@kamalgc.com.np"><i class="fa-solid fa-headset"></i> Support@kamalgc.com.np</a>
    </div>
    <div class="footer-copyright">
      &copy; 2026 KAMAL G.C. ALL RIGHTS RESERVED.
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>मेरो साथी</title>
<meta name="description" content="मेरो साथी - सबैको साझा डिजिटल चौतारी।">
<meta name="theme-color" content="#080d19">
<link rel="canonical" href="https://kamalgc.com.np/">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="mylogo.png">
<link rel="apple-touch-icon" href="mylogo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#080d19;
 --surface:#101a2b;
 --surface2:#17253b;
 --text:#f4f7ff;
 --muted:#a5b2c7;
 --line:rgba(163,190,230,.14);
 --accent:#72d5ff;
 --accent2:#a78bfa;
 --shadow:0 15px 45px rgba(0,0,0,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
 font-family:"DM Sans","Noto Sans Devanagari",sans-serif;
 background:radial-gradient(ellipse at 12% 8%,rgba(46,125,205,.15),transparent 34%),var(--bg);
 color:var(--text);min-height:100vh;line-height:1.65;
 padding-bottom:92px;overflow-x:hidden
}
button,input,textarea{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.container{width:min(750px,calc(100% - 24px));margin:auto}

/* HEADER */
.site-header{
 position:sticky;top:0;z-index:100;
 background:rgba(8,13,25,.95);
 backdrop-filter:blur(18px);
 border-bottom:1px solid var(--line)
}
.header-inner{
 min-height:65px;display:flex;align-items:center;
 justify-content:space-between;gap:12px
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-logo{
 width:39px;height:39px;object-fit:cover;
 border-radius:50%;border:1px solid var(--line)
}
.brand-name{font-size:16px;font-weight:800;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:8px}
.profile-link{
 width:40px;height:40px;border-radius:50%;
 overflow:hidden;border:2px solid var(--accent);
 display:block;flex-shrink:0;background:var(--surface2)
}
.profile-link img{width:100%;height:100%;object-fit:cover;display:block}
.header-profile-initials{
 width:100%;height:100%;display:grid;
 place-items:center;font-size:15px;font-weight:800;
 color:var(--accent)
}

/* LIVE INFO */
.live-info{
 display:flex;justify-content:space-between;align-items:center;
 flex-wrap:wrap;gap:7px 12px;margin-top:11px;
 padding:9px 12px;border:1px solid var(--line);
 border-radius:15px;background:var(--surface)
}
.live-info-item{
 display:flex;align-items:center;gap:5px;
 color:var(--muted);font-size:10px;font-weight:600
}
.live-info-item strong{color:var(--text)}
.live-dot{
 width:6px;height:6px;border-radius:50%;
 background:#39d98a;box-shadow:0 0 8px #39d98a
}

/* STORIES */
.stories-container{
 display:flex;gap:10px;overflow-x:auto;padding:12px 0;
 scrollbar-width:none
}
.stories-container::-webkit-scrollbar{display:none}
.story-card{
 flex:0 0 74px;height:115px;border-radius:14px;
 background:var(--surface);border:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:6px;cursor:pointer;position:relative;overflow:hidden
}
.story-card.add-story{border:2px dashed var(--accent)}
.story-card span{font-size:10px;font-weight:700;text-align:center;width:100%;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* REDESIGNED COMPOSER */
.composer{
 background:var(--surface);border:1px solid var(--line);
 border-radius:20px;padding:16px;margin:15px 0;
 box-shadow:var(--shadow)
}
.composer-top-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.composer-avatar{
 width:40px;height:40px;border-radius:50%;overflow:hidden;
 background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--accent);flex-shrink:0
}
.composer-inputs{flex:1;display:flex;flex-direction:column;gap:8px}
.composer textarea{
 width:100%;border:1px solid var(--line);
 background:var(--surface2);color:var(--text);
 border-radius:14px;padding:12px;outline:none;
 resize:none;min-height:75px;font-size:13px
}
.composer input[type="text"]{
 width:100%;border:1px solid var(--line);
 background:var(--surface2);color:var(--text);
 border-radius:10px;padding:10px 12px;outline:none;font-size:12px
}
.composer-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.emoji-picker-wrap{position:relative}
.emoji-dropdown{
 display:none;position:absolute;bottom:45px;left:0;
 background:var(--surface2);border:1px solid var(--line);
 border-radius:12px;padding:8px;font-size:18px;z-index:10;
 width:220px;flex-wrap:wrap;gap:6px;box-shadow:var(--shadow)
}
.emoji-dropdown span{cursor:pointer;padding:4px;border-radius:6px}
.emoji-dropdown span:hover{background:var(--surface)}
.primary-button{
 border:0;border-radius:12px;padding:9px 18px;
 font-size:12px;font-weight:800;background:linear-gradient(110deg,#75ddff,#b5a2ff);color:#071322
}
.secondary-button{
 border:1px solid var(--line);border-radius:10px;padding:8px 12px;
 font-size:11px;font-weight:700;background:var(--surface2);color:var(--text);
 display:inline-flex;align-items:center;gap:5px
}

/* FEED & POST CARDS */
.feed-heading{
 display:flex;justify-content:space-between;align-items:center;
 margin:20px 0 10px
}
.feed-heading h2{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:0.5px}
.post-grid{display:flex;flex-direction:column;gap:16px}
.post-card{
 background:var(--surface);border:1px solid var(--line);
 border-radius:17px;padding:16px;box-shadow:var(--shadow);position:relative
}
.post-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.post-author-wrap{display:flex;align-items:center;gap:10px}
.post-user-avatar{
 width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--surface2)
}
.post-author-info strong{display:block;font-size:14px}
.post-author-info small{color:var(--muted);font-size:10px}
.post-options{position:relative}
.options-btn{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px;cursor:pointer}
.options-dropdown{
 display:none;position:absolute;right:0;top:30px;
 background:var(--surface2);border:1px solid var(--line);
 border-radius:8px;box-shadow:var(--shadow);z-index:10;width:110px
}
.options-dropdown button{
 width:100%;text-align:left;background:none;border:0;
 color:var(--text);padding:8px 12px;font-size:11px;font-weight:700;cursor:pointer
}
.options-dropdown button:hover{background:var(--surface)}

.post-title{font-size:17px;font-weight:800;margin-bottom:8px}
.post-content{font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px}
.post-image{
 width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-bottom:12px;background:var(--surface2)
}

/* LONG PRESS REACTION POPUP BAR */
.reaction-popup-container{position:relative;display:inline-block}
.reaction-bar{
 display:none;position:absolute;bottom:42px;left:0;
 background:var(--surface2);border:1px solid var(--line);
 border-radius:30px;padding:6px 10px;gap:6px;box-shadow:var(--shadow);z-index:20;
 align-items:center;animation:fadeIn 0.15s ease
}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.reaction-bar.show{display:flex}
.reaction-btn{border:0;background:none;font-size:18px;cursor:pointer;padding:2px;transition:transform 0.1s}
.reaction-btn:hover{transform:scale(1.25)}
.reaction-details{margin-bottom:10px;color:var(--muted);font-size:11px}

.post-actions-bar{
 display:flex;justify-content:space-between;align-items:center;
 border-top:1px solid var(--line);padding-top:10px;margin-top:10px;flex-wrap:wrap;gap:8px
}
.post-action-btn{
 background:transparent;border:0;color:var(--muted);font-size:12px;font-weight:700;
 display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;cursor:pointer
}
.post-action-btn:hover{background:var(--surface2)}
.post-action-btn.active{color:var(--accent)}

/* COMMENTS SECTION */
.comment-area{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.comment{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.comment-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.comment-body{overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.6;margin-left:36px}
.comment-tools{margin:4px 0 0 36px}
.text-action{border:0;background:none;color:var(--accent);font-size:11px;padding:2px}
.reply-list{margin:8px 0 0 32px;padding-left:10px;border-left:2px solid var(--line)}
.comment-form,.reply-form{display:flex;gap:7px;margin-top:10px}
.comment-form input,.reply-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:8px 12px;font-size:12px;outline:none}

/* MODALS */
.modal-overlay{
 display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
 z-index:3000;justify-content:center;align-items:center;padding:15px;backdrop-filter:blur(5px)
}
.modal-box{
 background:var(--surface);border:1px solid var(--line);
 border-radius:18px;width:100%;max-width:450px;padding:20px;box-shadow:var(--shadow)
}

/* NAVIGATION */
#main-nav{
 position:fixed;z-index:1000;left:50%;
 bottom:max(7px,env(safe-area-inset-bottom));
 transform:translateX(-50%);
 width:min(620px,calc(100% - 14px));
 display:flex;justify-content:space-around;gap:3px;
 padding:6px 5px;background:rgba(17,28,46,.97);color:#edf3fc;
 border:1px solid rgba(255,255,255,.14);
 border-radius:16px;box-shadow:0 10px 35px rgba(0,0,0,.4);
 backdrop-filter:blur(18px)
}
#main-nav a{
 flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:5px 2px;border-radius:11px;color:#aab8cc;font-size:9px;font-weight:700
}
#main-nav .nav-icon{font-size:17px}
#main-nav a.active{background:linear-gradient(120deg,#24486a,#3c3567);color:#fff}

.site-toast{
 position:fixed;left:50%;bottom:100px;z-index:2000;
 transform:translate(-50%,15px);opacity:0;
 background:var(--surface2);color:var(--text);
 border:1px solid var(--line);border-radius:10px;
 padding:10px 15px;font-size:11px;pointer-events:none;transition:.2s
}
.site-toast.show{opacity:1;transform:translate(-50%,0)}
.footer{text-align:center;padding:25px 0;color:var(--muted);font-size:10px}
</style>
</head>

<body>

<header class="site-header">
 <div class="container header-inner">
  <div class="brand">
   <img class="brand-logo" src="mylogo.png" alt="Logo">
   <span class="brand-name">मेरो साथी</span>
  </div>
  <div class="header-right">
   <a href="profile.html" class="profile-link" aria-label="प्रोफाइल">
    <img id="header-user-photo" src="mylogo.png" alt="Profile">
    <span id="header-user-initials" class="header-profile-initials" hidden>म</span>
   </a>
  </div>
 </div>
</header>

<main class="container">

 <!-- LIVE INFO -->
 <section class="live-info" aria-label="Live info">
  <div class="live-info-item"><span class="live-dot"></span><strong id="real-time">समय लोड हुँदै...</strong></div>
  <div class="live-info-item"><span>🌡️</span><strong id="weather-temp">--°C</strong></div>
  <div class="live-info-item"><span>📍</span><strong id="user-location">स्थान</strong></div>
 </section>

 <!-- STORIES BAR -->
 <section class="stories-container" id="stories-bar">
  <div class="story-card add-story" onclick="openStoryModal()">
   <span style="font-size:22px;color:var(--accent)">＋</span>
   <span>तपाईंको Story</span>
  </div>
 </section>

 <!-- REDESIGNED POST COMPOSER -->
 <section class="composer" id="post-composer-box">
  <form id="inline-post-form">
   <div class="composer-top-row">
    <div class="composer-avatar" id="composer-user-avatar">म</div>
    <div class="composer-inputs">
     <textarea id="composer-content" placeholder="आज मनमा के कुरा खेलिरहेछ? यहाँ लेख्नुहोस्..." maxlength="5000" required></textarea>
     <input type="text" id="composer-title" placeholder="पोष्टको शिर्षक (वैकल्पिक)">
    </div>
   </div>
   
   <div class="composer-bottom">
    <div style="display:flex;gap:8px;align-items:center">
     <label class="secondary-button">
      📷 फोटो जोड्नुहोस् <input type="file" id="composer-image" accept="image/*" hidden>
     </label>
     <div class="emoji-picker-wrap">
      <button type="button" class="secondary-button" id="emoji-toggle">😀 इमोजी</button>
      <div class="emoji-dropdown" id="emoji-box">
       <span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('❤️')">❤️</span>
       <span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('👍')">👍</span>
       <span onclick="addEmoji('👏')">👏</span><span onclick="addEmoji('🙏')">🙏</span>
       <span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('✨')">✨</span>
      </div>
     </div>
    </div>
    <button type="submit" class="primary-button" id="publish-btn">पोष्ट गर्नुहोस्</button>
   </div>
  </form>
 </section>

 <!-- FEED (बकम्फुसे शब्द हटाइएको) -->
 <section class="feed-section">
  <div class="feed-heading">
   <h2>नवीनतम पोष्टहरू</h2>
   <span id="post-count" style="font-size:11px;color:var(--muted)">लोड हुँदैछ...</span>
  </div>

  <div id="post-grid" class="post-grid">
   <div style="text-align:center;padding:30px;color:var(--muted)">पोष्टहरू लोड हुँदैछन्...</div>
  </div>
 </section>

</main>

<!-- STORY UPLOAD MODAL -->
<div class="modal-overlay" id="story-modal">
 <div class="modal-box">
  <h3 style="margin-bottom:10px;font-size:15px">नयाँ स्टोरी थप्नुहोस्</h3>
  <form id="story-form" onsubmit="uploadStory(event)">
   <input type="text" id="story-caption" placeholder="स्टोरीको क्याप्सन..." maxlength="100" style="width:100%;padding:10px;margin-bottom:10px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;" required>
   <input type="file" id="story-file" accept="image/*" style="margin-bottom:12px;width:100%;font-size:11px" required>
   <div style="display:flex;justify-content:flex-end;gap:8px">
    <button type="button" class="secondary-button" onclick="closeStoryModal()">रद्द गर्नुहोस्</button>
    <button type="submit" class="primary-button" id="story-btn">स्टोरी सेयर गर्नुहोस्</button>
   </div>
  </form>
 </div>
</div>

<footer class="footer">
 © <span id="current-year">2026</span> मेरो साथी · सर्वाधिकार सुरक्षित।
</footer>

<nav id="main-nav">
 <a href="index.html" class="active"><span class="nav-icon">⌂</span><span>Home</span></a>
 <a href="messages.html"><span class="nav-icon">✉</span><span>Message</span></a>
 <a href="notifications.html"><span class="nav-icon">♢</span><span>सूचना</span></a>
 <a href="settings.html"><span class="nav-icon">⚙</span><span>Setting</span></a>
</nav>

<div id="site-toast" class="site-toast"></div>

<script>
"use strict";
const SUPABASE_URL="https://zbyntmyybhdcwmttkuys.supabase.co";
const SUPABASE_KEY="sb_publishable_N8U3og_Ntm-ImrtM8c1NGA_-Rqb3dSy";
const BUCKET="blog-images";
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let currentUser=null,profilesCache={},cachedPosts=[];

const REACTIONS=[
 {value:"👌",label:"सहमति"},
 {value:"🤔",label:"सोच"},
 {value:"😘",label:"माया"},
 {value:"😰",label:"सहानुभूति"},
 {value:"🤛",label:"समर्थन"}
];

function showToast(msg){
 const t=$("site-toast");t.textContent=msg;t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2500);
}

$("emoji-toggle").onclick=()=>{
 const box=$("emoji-box");
 box.style.display=box.style.display==="flex"?"none":"flex";
};
window.addEmoji=(emoji)=>{
 $("composer-content").value+=emoji;
 $("emoji-box").style.display="none";
};

setInterval(()=>{
 $("real-time").textContent=new Date().toLocaleTimeString("ne-NP");
},1000);
$("weather-temp").textContent="२४°C";
$("user-location").textContent="नेपाल";

function profileName(p){return p?.display_name||"मेरो साथी सदस्य";}
function avatarHTML(p,size=35){
 const name=profileName(p);
 return `<div class="post-user-avatar" style="width:${size}px;height:${size}px;display:grid;place-items:center;font-weight:800;color:var(--accent);overflow:hidden">${p?.avatar_url?`<img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover">`:(name.charAt(0)||"M").toUpperCase()}</div>`;
}

async function loadProfiles(ids){
 const missing=[...new Set(ids)].filter(id=>id&&!profilesCache[id]);
 if(!missing.length)return;
 const {data}=await db.from("profiles").select("id,display_name,avatar_url").in("id",missing);
 (data||[]).forEach(p=>profilesCache[p.id]=p);
}

async function boot(){
 if(!db)return;
 const {data}=await db.auth.getSession();
 currentUser=data.session?.user||null;
 
 if(currentUser){
  const {data:profile}=await db.from("profiles").select("display_name,avatar_url").eq("id",currentUser.id).maybeSingle();
  if(profile){
   profilesCache[currentUser.id]=profile;
   if(profile.avatar_url) {
    $("header-user-photo").src=profile.avatar_url;
    $("composer-user-avatar").innerHTML=`<img src="${profile.avatar_url}" style="width:100%;height:100%;object-fit:cover">`;
   } else {
    const initial=(profile.display_name||"म").charAt(0).toUpperCase();
    $("header-user-initials").textContent=initial;
    $("header-user-initials").hidden=false; $("header-user-photo").hidden=true;
    $("composer-user-avatar").textContent=initial;
   }
  }
 }
 loadFeed();
 loadStories();
 initRealtime();
}

function initRealtime(){
 db.channel('public-db-changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'blog_posts' }, () => { loadFeed(); })
  .on('postgres_changes', { event: '*', schema: 'public', table: 'post_comments' }, () => { loadFeed(); })
  .subscribe();
}

window.openStoryModal=()=>{
 if(!currentUser) return showToast("स्टोरी हाल्न पहिले Login गर्नुहोस्!");
 $("story-modal").style.display="flex";
};
window.closeStoryModal=()=>{ $("story-modal").style.display="none"; };

window.uploadStory=async(e)=>{
 e.preventDefault();
 const caption=$("story-caption").value.trim();
 const file=$("story-file").files[0];
 const btn=$("story-btn");
 btn.disabled=true; btn.textContent="अपलोड हुँदैछ...";
 try{
  if(file.size > 2 * 1024 * 1024) throw new Error("फोटोको साइज २MB भन्दा सानो हुनुपर्छ।");
  const path=`stories/${currentUser.id}/${Date.now()}-${file.name}`;
  const {error:upErr}=await db.storage.from(BUCKET).upload(path,file);
  if(upErr)throw upErr;
  const imageUrl=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  
  const {error}=await db.from("stories").insert({user_id:currentUser.id, image_url:imageUrl, caption});
  if(error)throw error;

  showToast("स्टोरी सफलतापूर्वक सेयर भयो! 🌟");
  closeStoryModal();
  loadStories();
 }catch(err){
  showToast("त्रुटि: "+err.message);
 }finally{
  btn.disabled=false; btn.textContent="स्टोरी सेयर गर्नुहोस्";
 }
};

async function loadStories(){
 const {data}=await db.from("stories").select("id, image_url, caption, user_id, created_at").order("created_at",{ascending:false}).limit(20);
 const container=$("stories-bar");
 const addCard=`<div class="story-card add-story" onclick="openStoryModal()"><span style="font-size:22px;color:var(--accent)">＋</span><span>तपाईंको Story</span></div>`;
 
 if(!data || !data.length){ container.innerHTML=addCard; return; }
 await loadProfiles(data.map(s=>s.user_id));
 container.innerHTML=addCard + data.map(s=>{
  const profile=profilesCache[s.user_id];
  return `<div class="story-card" title="${s.caption}">
   <img src="${s.image_url}" style="width:100%;height:100%;object-fit:cover;position:absolute">
   <div style="position:absolute;bottom:0;background:rgba(0,0,0,0.6);width:100%;padding:3px;">
    <span>${profileName(profile)}</span>
   </div>
  </div>`;
 }).join("");
}

$("inline-post-form").onsubmit=async(e)=>{
 e.preventDefault();
 if(!currentUser){ showToast("पोष्ट गर्न पहिले Login गर्नुहोस्!"); return; }
 const content=$("composer-content").value.trim();
 const title=$("composer-title").value.trim()||content.slice(0,30)+"...";
 const file=$("composer-image").files[0];
 const btn=$("publish-btn");
 
 btn.disabled=true; btn.textContent="पोष्ट हुँदैछ...";
 try{
  let imageUrl=null;
  if(file){
   if(file.size > 2 * 1024 * 1024) throw new Error("फोटोको साइज २MB भन्दा सानो हुनुपर्छ।");
   const path=`${currentUser.id}/${Date.now()}-${file.name}`;
   const {error:upErr}=await db.storage.from(BUCKET).upload(path,file);
   if(upErr)throw upErr;
   imageUrl=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }
  const authorName=profilesCache[currentUser.id]?.display_name||currentUser.email.split("@")[0];
  const {error}=await db.from("blog_posts").insert({
   title,content,image_url:imageUrl,author_id:currentUser.id,author_name:authorName
  });
  if(error)throw error;
  $("inline-post-form").reset();
  showToast("पोष्ट सफलतापूर्वक सेयर भयो! 🎉");
  loadFeed();
 }catch(err){showToast("त्रुटि: "+err.message);}
 finally{btn.disabled=false; btn.textContent="पोष्ट गर्नुहोस्";}
};

async function loadFeed(){
 const {data:posts,error}=await db.from("blog_posts").select("id,title,content,image_url,created_at,author_id,author_name").order("created_at",{ascending:false}).limit(50);
 if(error){$("post-grid").innerHTML="फिड लोड गर्न असफल।";return;}
 
 cachedPosts=posts||[];
 $("post-count").textContent=`${cachedPosts.length} पोष्टहरू`;
 if(!cachedPosts.length){
  $("post-grid").innerHTML='<div style="text-align:center;padding:30px;color:var(--muted)">अहिलेसम्म कुनै पोष्ट छैन। पहिलो पोष्ट तपाईं लेख्नुहोस्!</div>';
  return;
 }

 const postIds=cachedPosts.map(p=>p.id);
 await loadProfiles(cachedPosts.map(p=>p.author_id));

 const [likesRes,commentsRes,reactionsRes]=await Promise.all([
  db.from("post_likes").select("post_id,user_id").in("post_id",postIds),
  db.from("post_comments").select("id,post_id,user_id,content,created_at,parent_comment_id").in("post_id",postIds).order("created_at",{ascending:true}),
  db.from("post_reactions").select("post_id,user_id,reaction").in("post_id",postIds)
 ]);

 const likes=likesRes.data||[], comments=commentsRes.data||[], reactions=reactionsRes.data||[];
 await loadProfiles([...comments.map(c=>c.user_id),...reactions.map(r=>r.user_id)]);

 $("post-grid").innerHTML=cachedPosts.map(post=>{
  const profile=profilesCache[post.author_id];
  const author=profileName(profile)||post.author_name||"मेरो साथी सदस्य";
  const postLikes=likes.filter(l=>l.post_id===post.id);
  const liked=currentUser?postLikes.some(l=>l.user_id===currentUser.id):false;
  const postComments=comments.filter(c=>c.post_id===post.id);
  const roots=postComments.filter(c=>!c.parent_comment_id);
  const postReactions=reactions.filter(r=>r.post_id===post.id);
  const myReaction=currentUser?postReactions.find(r=>r.user_id===currentUser.id):null;

  const reactionNames=REACTIONS.map(r=>{
   const people=postReactions.filter(x=>x.reaction===r.value);
   if(!people.length)return "";
   return `${r.value} ${people.map(x=>profileName(profilesCache[x.user_id])).join(", ")}`;
  }).filter(Boolean).join(" · ");

  const isOwner=currentUser && currentUser.id===post.author_id;

  return `
  <article class="post-card" data-post="${post.id}">
   <div class="post-header">
    <div class="post-author-wrap">
     ${avatarHTML(profile)}
     <div class="post-author-info">
      <strong>${author}</strong>
      <small>${new Date(post.created_at).toLocaleString("ne-NP")}</small>
     </div>
    </div>
    ${isOwner?`
     <div class="post-options">
      <button class="options-btn" onclick="toggleOptions('${post.id}')">⋮</button>
      <div class="options-dropdown" id="opt-${post.id}">
       <button onclick="editPost('${post.id}')">✏️ सम्पादन</button>
       <button onclick="deletePost('${post.id}')" style="color:#ff6b6b">🗑️ मेटाउनुहोस्</button>
      </div>
     </div>
    `:""}
   </div>
   <div class="post-title">${post.title}</div>
   <div class="post-content">${post.content}</div>
   ${post.image_url?`<img src="${post.image_url}" class="post-image" alt="Post">`:""}

   <div class="reaction-details">${reactionNames||""}</div>

   <!-- ACTIONS & LONG PRESS / HOVER REACTION POPUP -->
   <div class="post-actions-bar">
    <div class="reaction-popup-container" onmouseleave="hideReactionPopup('${post.id}')">
     <button class="post-action-btn ${liked?"active":""}" 
             onclick="toggleLike('${post.id}')" 
             onmouseenter="showReactionPopup('${post.id}')"
             ontouchstart="handleTouchStart(event, '${post.id}')">
      ${myReaction ? myReaction.reaction : (liked ? "♥ मन पर्यो" : "♡ Like")} (${postLikes.length})
     </button>
     
     <!-- इमोजी बार जो लङ्ग प्रेस वा होभर गर्दा मात्र देखिन्छ -->
     <div class="reaction-bar" id="react-bar-${post.id}">
      ${REACTIONS.map(r=>`<button class="reaction-btn" onclick="handleReaction('${post.id}','${r.value}')">${r.value}</button>`).join("")}
     </div>
    </div>

    <button class="post-action-btn" onclick="toggleComments('${post.id}')">💬 Comment (${postComments.length})</button>
    <button class="post-action-btn" onclick="sharePost('${post.title}','${post.id}')">🔗 सेयर</button>
    <button class="post-action-btn" onclick="bookmarkPost('${post.id}')">🔖 सेभ</button>
   </div>

   <!-- COMMENTS AREA -->
   <section class="comment-area hidden" id="comments-${post.id}">
    <div>${roots.map(c=>renderComment(c,postComments)).join("")}</div>
    <form class="comment-form" onsubmit="submitComment(event,'${post.id}')">
     <input name="comment" maxlength="3000" required placeholder="आफ्नो Comment लेख्नुहोस्...">
     <button class="primary-button" style="padding:6px 12px">पठाउनुहोस्</button>
    </form>
   </section>
  </article>`;
 }).join("");
}

// Long press & Hover logic for reactions
let pressTimer = null;
function showReactionPopup(id){
 $("react-bar-"+id).classList.add("show");
}
function hideReactionPopup(id){
 $("react-bar-"+id).classList.remove("show");
}
function handleTouchStart(e, id){
 pressTimer = setTimeout(()=>{
  showReactionPopup(id);
 }, 500); // ०.५ सेकेन्ड थिइराखेपछि देखिने
}
window.addEventListener('touchend', ()=>{
 if(pressTimer) clearTimeout(pressTimer);
});

function renderComment(comment,allComments){
 const profile=profilesCache[comment.user_id];
 const replies=allComments.filter(c=>String(c.parent_comment_id)===String(comment.id));
 return `
 <div class="comment">
  <div class="comment-head">
   ${avatarHTML(profile,26)}
   <strong>${profileName(profile)}</strong>
   <span style="color:var(--muted);font-size:10px">${new Date(comment.created_at).toLocaleTimeString("ne-NP")}</span>
  </div>
  <div class="comment-body">${comment.content}</div>
  <div class="comment-tools">
   <button class="text-action" onclick="toggleReplyForm('${comment.id}')">↳ Reply</button>
  </div>
  <form class="reply-form hidden" id="reply-form-${comment.id}" onsubmit="submitReply(event,'${comment.post_id}','${comment.id}')">
   <input name="reply" maxlength="3000" required placeholder="जवाफ लेख्नुहोस्...">
   <button class="secondary-button">पठाउनुहोस्</button>
  </form>
  ${replies.length?`<div class="reply-list">${replies.map(r=>`
   <div class="comment">
    <div class="comment-head">${avatarHTML(profilesCache[r.user_id],22)} <strong>${profileName(profilesCache[r.user_id])}</strong></div>
    <div class="comment-body">${r.content}</div>
   </div>
  `).join("")}</div>`:""}
 </div>`;
}

window.toggleOptions=(id)=>{
 const el=$("opt-"+id);
 el.style.display=el.style.display==="block"?"none":"block";
};

window.deletePost=async(id)=>{
 if(!confirm("के तपाईं यो पोष्ट मेटाउन चाहनुहुन्छ?"))return;
 const {error}=await db.from("blog_posts").delete().eq("id",id);
 if(error) showToast("त्रुटि: "+error.message);
 else{ showToast("पोष्ट मेटाइयो! 🗑️"); loadFeed(); }
};

window.editPost=async(id)=>{
 const post=cachedPosts.find(p=>p.id===id);
 if(!post)return;
 const newContent=prompt("पोष्ट सच्याउनुहोस्:",post.content);
 if(newContent===null)return;
 const {error}=await db.from("blog_posts").update({content:newContent}).eq("id",id);
 if(error) showToast("त्रुटि: "+error.message);
 else{ showToast("पोष्ट अपडेट भयो! ✨"); loadFeed(); }
};

window.toggleLike=async(postId)=>{
 if(!currentUser)return showToast("Like गर्न पहिले Login गर्नुहोस्।");
 const {data}=await db.from("post_likes").select("id").eq("post_id",postId).eq("user_id",currentUser.id).maybeSingle();
 if(data) await db.from("post_likes").delete().eq("post_id",postId).eq("user_id",currentUser.id);
 else await db.from("post_likes").insert({post_id:postId,user_id:currentUser.id});
 loadFeed();
};

window.handleReaction=async(postId,reaction)=>{
 if(!currentUser)return showToast("प्रतिक्रिया दिन पहिले Login गर्नुहोस्।");
 hideReactionPopup(postId);
 const {data}=await db.from("post_reactions").select("id,reaction").eq("post_id",postId).eq("user_id",currentUser.id).maybeSingle();
 if(data){
  if(data.reaction===reaction) await db.from("post_reactions").delete().eq("post_id",postId).eq("user_id",currentUser.id);
  else await db.from("post_reactions").update({reaction}).eq("post_id",postId).eq("user_id",currentUser.id);
 }else{
  await db.from("post_reactions").insert({post_id:postId,user_id:currentUser.id,reaction});
 }
 loadFeed();
};

window.toggleComments=(id)=>{ $("comments-"+id).classList.toggle("hidden"); };
window.toggleReplyForm=(id)=>{ $("reply-form-"+id).classList.toggle("hidden"); };

window.submitComment=async(e,postId)=>{
 e.preventDefault();
 if(!currentUser)return showToast("Comment गर्न पहिले Login गर्नुहोस्।");
 const input=e.target.elements.comment;
 const content=input.value.trim(); if(!content)return;
 await db.from("post_comments").insert({post_id:postId,user_id:currentUser.id,content});
 input.value=""; loadFeed();
};

window.submitReply=async(e,postId,parentId)=>{
 e.preventDefault();
 if(!currentUser)return showToast("Reply दिन पहिले Login गर्नुहोस्।");
 const input=e.target.elements.reply;
 const content=input.value.trim(); if(!content)return;
 await db.from("post_comments").insert({post_id:postId,user_id:currentUser.id,content,parent_comment_id:parentId});
 input.value=""; loadFeed();
};

window.sharePost=(title, id)=>{
 const url=`${location.origin}/index.html?post=${id}`;
 navigator.clipboard.writeText(url);
 showToast("पोष्टको लिंक कपी भयो! 📋");
};

window.bookmarkPost=(id)=>{
 let bookmarks=JSON.parse(localStorage.getItem("saved_bookmarks")||"[]");
 if(!bookmarks.includes(id)){
  bookmarks.push(id);
  localStorage.setItem("saved_bookmarks",JSON.stringify(bookmarks));
  showToast("बुकमार्कमा सेभ भयो! 🔖");
 }else{ showToast("यो पोष्ट पहिले नै सेभ छ।"); }
};

$("current-year").textContent=new Date().getFullYear();
boot();
</script>

<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कमल जी.सी. - आधिकारिक वेबसाइट</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        /* Top Bar / Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #2c3e50;
        }

        .logo-text {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Sidebar Menu */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #2c3e50;
            color: #ffffff;
            transition: left 0.3s ease;
            z-index: 1100;
            padding-top: 80px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li {
            padding: 15px 25px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            display: block;
        }

        .sidebar ul li a:hover {
            color: #3498db;
        }

        /* Main Container */
        .main-container {
            max-width: 1200px;
            margin: 80px auto 40px auto;
            padding: 20px;
        }

        /* Hero / About Section with 16:9 layout */
        .hero-section {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .hero-image-container {
            flex: 1;
            min-width: 300px;
            aspect-ratio: 16 / 9;
            background-color: #e2e8f0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-content {
            flex: 1;
            min-width: 300px;
            padding: 40px;
        }

        .tagline {
            font-style: italic;
            color: #2980b9;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        h1 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 2em;
        }

        h2 {
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            margin-top: 30px;
        }

        .section-box {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px;
            margin-bottom: 30px;
        }

        .contact-list {
            list-style: none;
            padding: 0;
        }

        .contact-list li {
            margin-bottom: 10px;
        }

        .contact-list a {
            color: #2980b9;
            text-decoration: none;
        }

        .contact-list a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .hero-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="logo-text">kamalgc.com.np</div>
        <div style="width: 24px;"></div>
    </header>

    <nav class="sidebar" id="sidebar">
        <button class="sidebar-close" onclick="toggleSidebar()">&times;</button>
        <ul>
            <li><a href="#home" onclick="toggleSidebar()">गृहपृष्ठ (Home)</a></li>
            <li><a href="#about" onclick="toggleSidebar()">मेरो बारेमा (About Me)</a></li>
            <li><a href="#gallery" onclick="toggleSidebar()">ग्यालरी (Gallery)</a></li>
            <li><a href="#tech" onclick="toggleSidebar()">AI र प्रविधि (AI & Tech)</a></li>
            <li><a href="#blog" onclick="toggleSidebar()">ब्लग / अपडेट्स (Blog)</a></li>
            <li><a href="#contact" onclick="toggleSidebar()">सम्पर्क (Contact)</a></li>
        </ul>
    </nav>

    <div class="main-container" id="home">

        <div class="hero-section">
            <div class="hero-image-container">
                <img src="kamal.png" alt="Kamal G.C.">
            </div>
